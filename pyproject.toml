[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patbati"
version = "2.0.2.dev0"
description = "Application d'inventaire du patrimoine bâti d'un territoire (Django / PostGIS / Mapentity)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Parc national des Écrins" }]
keywords = ["django", "mapentity", "postgis", "patrimoine", "inventaire"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "django",
    "mapentity==8.13.2",
    "dotenv",
    "psycopg2",
    "bcrypt",
    "Authlib",
    "factory-boy",
]

[project.optional-dependencies]
dev = ["codecov", "beautifulsoup4", "factory-boy", "pip-tools"]

[project.urls]
Homepage = "https://github.com/PnEcrins/Patrimoine-bati"
Repository = "https://github.com/PnEcrins/Patrimoine-bati"
Issues = "https://github.com/PnEcrins/Patrimoine-bati/issues"
Changelog = "https://github.com/PnEcrins/Patrimoine-bati/blob/main/changelog.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["patbati", "patbati.*", "authent", "authent.*", "ssoauth", "ssoauth.*", "zoning", "zoning.*"]

[tool.coverage.run]
source = ["patbati", "authent", "ssoauth", "zoning"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/settings_local.py",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
